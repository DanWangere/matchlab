# Builds the image and pushes it to GitHub's registry (ghcr.io/<owner>/matchlab) on every push to
# main. Needs no Azure identity: a laptop can then deploy the template with `az deployment group
# create` pointing imageRef at the tag this prints (see docs/deploy.md, "Deploy from a laptop").
name: image

on:
  push:
    branches: [main]
    paths: [matchlab/**, renderer/**, Dockerfile, pyproject.toml, .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: img
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/matchlab" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          {
            echo "## image"
            echo "\`${{ steps.img.outputs.name }}:${{ steps.img.outputs.tag }}\` (also \`:latest\`)"
            echo "First time: make the package public (your profile, Packages, matchlab, Package settings, Change visibility), or deploy with registryUsername/registryPassword."
          } >> "$GITHUB_STEP_SUMMARY"
