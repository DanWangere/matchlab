# Builds the image and deploys the hub (scale-to-zero app) and the fork service (per-match job)
# to Azure Container Apps. See docs/deploy.md for the one-time setup.
#
#   secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#              MATCHLAB_HUB_KEY, EVENTHUB_CONNECTION_STRING, EVENTHUB_NAME (the custom endpoint destination forkd reads),
#              KUSTO_QUERY_URI, KUSTO_INGEST_URI (optional), FOUNDRY_API_KEY (optional, when the identity cannot get the Azure AI User role),
#              GHCR_PULL_TOKEN (optional: a token with read:packages, only if the image package stays private)
#   variables: AZURE_RESOURCE_GROUP, AZURE_LOCATION, FOUNDRY_MODEL_ENDPOINT, FOUNDRY_DEPLOYMENT,
#              FOUNDRY_ACCOUNT_NAME, FOUNDRY_RESOURCE_GROUP (optional), COSMOS_ACCOUNT_NAME, COSMOS_RESOURCE_GROUP (optional),
#              FORKD_SOURCE (optional), FORKD_MATCH (optional), FORKD_SCHEDULE (optional cron),
#              CONTAINER_REGISTRY = ghcr (default) | acr
name: deploy

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Where forkd reads the match from"
        type: choice
        options: [eventhub, eventhouse]
        default: eventhub
      match:
        description: "Match id (eventhouse source only)"
        default: ""
      agents:
        description: "Agent team"
        type: choice
        options: [foundry, framework, fake, "off"]
        default: foundry
      hub_always_on:
        description: "Keep one hub replica warm (about $0.05 an hour)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  packages: write

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-matchlab' }}
      LOCATION: ${{ vars.AZURE_LOCATION || 'swedencentral' }}
      REGISTRY_KIND: ${{ vars.CONTAINER_REGISTRY || 'ghcr' }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: img
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "ghcr=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/matchlab" >> "$GITHUB_OUTPUT"

      # ---- image on GitHub's registry (default: no Azure registry, no standing cost)
      - uses: docker/login-action@v3
        if: env.REGISTRY_KIND == 'ghcr'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: env.REGISTRY_KIND == 'ghcr'
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.ghcr }}:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.ghcr }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resource group
        run: az group create -n "$RG" -l "$LOCATION" -o none

      # ---- image on an Azure Container Registry (CONTAINER_REGISTRY=acr): create it, then build into it
      - name: Registry and base resources (acr)
        if: env.REGISTRY_KIND == 'acr'
        id: base
        run: |
          az deployment group create -g "$RG" -n matchlab-base -f infra/main.bicep \
            -p createRegistry=true hubKey="${{ secrets.MATCHLAB_HUB_KEY }}" -o none
          REGISTRY=$(az deployment group show -g "$RG" -n matchlab-base --query properties.outputs.registryLoginServer.value -o tsv)
          az acr build --registry "${REGISTRY%%.*}" --image "matchlab:${{ steps.img.outputs.tag }}" --file Dockerfile . -o none

      - name: Deploy
        id: apps
        run: |
          if [ "$REGISTRY_KIND" = "acr" ]; then
            IMAGE_ARGS="createRegistry=true imageTag=${{ steps.img.outputs.tag }}"
          else
            IMAGE_ARGS="imageRef=${{ steps.img.outputs.ghcr }}:${{ steps.img.outputs.tag }}"
            if [ -n "${{ secrets.GHCR_PULL_TOKEN }}" ]; then
              IMAGE_ARGS="$IMAGE_ARGS registryUsername=${{ github.actor }} registryPassword=${{ secrets.GHCR_PULL_TOKEN }}"
            fi
          fi
          az deployment group create -g "$RG" -n matchlab-apps -f infra/main.bicep \
            -p $IMAGE_ARGS \
               hubKey="${{ secrets.MATCHLAB_HUB_KEY }}" \
               hubAlwaysOn=${{ inputs.hub_always_on || false }} \
               forkdSource="${{ inputs.source || vars.FORKD_SOURCE || 'eventhub' }}" \
               forkdMatch="${{ inputs.match || vars.FORKD_MATCH || '' }}" \
               forkdSchedule="${{ vars.FORKD_SCHEDULE || '' }}" \
               agents="${{ inputs.agents || 'foundry' }}" \
               eventHubConnectionString="${{ secrets.EVENTHUB_CONNECTION_STRING }}" \
               eventHubName="${{ secrets.EVENTHUB_NAME }}" \
               kustoQueryUri="${{ secrets.KUSTO_QUERY_URI }}" \
               kustoIngestUri="${{ secrets.KUSTO_INGEST_URI }}" \
               foundryModelEndpoint="${{ vars.FOUNDRY_MODEL_ENDPOINT }}" \
               foundryDeployment="${{ vars.FOUNDRY_DEPLOYMENT || 'gpt-5.6-sol' }}" \
               foundryApiKey="${{ secrets.FOUNDRY_API_KEY }}" \
               foundryAccountName="${{ vars.FOUNDRY_ACCOUNT_NAME }}" \
               foundryResourceGroup="${{ vars.FOUNDRY_RESOURCE_GROUP || vars.AZURE_RESOURCE_GROUP || 'rg-matchlab' }}" \
               cosmosAccountName="${{ vars.COSMOS_ACCOUNT_NAME }}" \
               cosmosResourceGroup="${{ vars.COSMOS_RESOURCE_GROUP || vars.AZURE_RESOURCE_GROUP || 'rg-matchlab' }}" \
            -o none
          echo "hub=$(az deployment group show -g "$RG" -n matchlab-apps --query properties.outputs.hubUrl.value -o tsv)" >> "$GITHUB_OUTPUT"
          echo "principal=$(az deployment group show -g "$RG" -n matchlab-apps --query properties.outputs.identityPrincipalId.value -o tsv)" >> "$GITHUB_OUTPUT"
          echo "job=$(az deployment group show -g "$RG" -n matchlab-apps --query properties.outputs.forkJobName.value -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Smoke test (wakes the hub)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ steps.apps.outputs.hub }}/healthz"; then exit 0; fi
            sleep 10
          done
          echo "hub did not answer" && exit 1

      - name: Summary
        run: |
          {
            echo "## matchlab"
            echo "- overlay: ${{ steps.apps.outputs.hub }}  (sleeps when idle; the first visit wakes it)"
            echo "- fork job: \`az containerapp job start -n ${{ steps.apps.outputs.job }} -g $RG\` before kick-off, or the matchday workflow"
            echo "- services identity (principal id): \`${{ steps.apps.outputs.principal }}\`; add it to the Fabric workspace as Contributor"
          } >> "$GITHUB_STEP_SUMMARY"
