[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matchlab"
version = "0.1.0"
description = "Synthetic football league with hidden ground truth and a rewindable, deterministic event simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
eventhub = ["azure-eventhub>=5.11"]
fabric = ["azure-kusto-data>=4.5", "azure-kusto-ingest>=4.5", "azure-identity>=1.17"]
agents = ["openai>=1.50", "azure-identity>=1.17"]
framework = ["agent-framework-openai>=1.20"]
evals = ["azure-ai-evaluation>=1.10"]
dev = ["pytest>=8"]

[project.scripts]
matchlab = "matchlab.cli:main"

[tool.setuptools.packages.find]
include = ["matchlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
